# ============================================================
# Model Scale Specification -- 1.3B
# ============================================================
# This yaml specifies the model scale for training / evaluation.
# Every entry point (train.py, test.py, fast_test.py) selects it via
# `--model-config <path>`.
#
# Field semantics follow module/modeling.py::ModelConfig. Unknown keys
# fail loudly at load time; missing keys fall back to the dataclass
# defaults. Branches whose ModelConfig has different fields should
# adjust their own copy of this file.
# ============================================================

vocab_size: 32000
n_layers: 24
dim: 2048
rotary_dim: 128
n_heads: 16
expand_ratio: 4
rotary_base: 10000
key_expand: 1
